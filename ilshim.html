<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일쉼지원센터 - 맘편한 임산부 우선이용</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose:   #F43F5E;
            --violet: #7C3AED;
            --plum:   #4C1D95;
            --ink:    #1E1B2E;
            --white:  #FFFFFF;
            --gray:   #6B7280;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Noto Sans KR',sans-serif; background:#F8F7FF; color:var(--ink); min-height:100vh; }
        .container { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:white; overflow:hidden; }

        /* 헤더 */
        .main-header { position:relative; padding:28px 24px 38px; overflow:hidden; background:#fff0f5; }
        .main-header::before {
            content:''; position:absolute; inset:0;
            background:
                radial-gradient(ellipse 130% 70% at 0%   0%,  #C026D3 0%, transparent 55%),
                radial-gradient(ellipse 90%  80% at 100% 0%,  #FB7185 0%, transparent 50%),
                radial-gradient(ellipse 70%  60% at 50%  40%, #E879F9 0%, transparent 50%),
                radial-gradient(ellipse 100% 50% at 50% 100%, #ffffff 0%, transparent 60%);
            opacity: 0.88;
        }
        .main-header::after {
            content:''; position:absolute; bottom:0; left:0; right:0;
            height:50%; background:linear-gradient(to bottom, transparent, rgba(255,255,255,0.7));
            pointer-events:none;
        }
        .header-inner { position:relative; z-index:2; }
        .back-link {
            display:inline-flex; align-items:center; gap:6px;
            background:rgba(76,29,149,0.12); color:rgba(76,29,149,0.85);
            text-decoration:none; padding:7px 14px; border-radius:20px;
            font-size:0.78rem; font-weight:700; margin-bottom:18px; transition:background .2s;
        }
        .back-link:hover { background:rgba(76,29,149,0.2); }
        .logo-img-header { height:40px; width:auto; filter:brightness(0) saturate(0%); margin-bottom:16px; opacity:0.7; }
        .inst-badge {
            display:inline-block; background:rgba(76,29,149,0.12);
            color:rgba(76,29,149,0.8); border-radius:20px;
            padding:4px 12px; font-size:0.74rem; font-weight:700; margin-bottom:8px;
        }
        .main-header h1 { font-size:1.7rem; font-weight:600; color:#3B0764; line-height:1.3; letter-spacing:-.02em; margin-bottom:6px; }
        .header-sub { font-size:0.78rem; color:rgba(76,29,149,0.55); }

        /* 메인 */
        main { flex:1; padding:22px 20px; background:white; }

        /* STEP 카드 */
        .step-card { border-radius:18px; overflow:hidden; box-shadow:0 2px 16px rgba(124,58,237,.1); margin-bottom:18px; }
        .step-card-top {
            background:linear-gradient(135deg,#4C1D95 0%,#7C3AED 50%,#DB2777 100%);
            padding:14px 20px 12px;
        }
        .step-card-top-row { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
        .step-pill { background:rgba(255,255,255,.22); color:white; font-size:.68rem; font-weight:800; padding:3px 10px; border-radius:20px; letter-spacing:.06em; }
        .step-title { font-size:.95rem; font-weight:800; color:white; }
        .step-desc { font-size:.75rem; color:rgba(255,255,255,.75); }
        .step-card-body { background:#FAFAFA; padding:18px 20px; border:1px solid rgba(124,58,237,.08); border-top:none; border-radius:0 0 18px 18px; }

        .date-label { display:block; font-weight:700; margin-bottom:8px; color:#374151; font-size:.85rem; }
        .date-input {
            width:100%; padding:14px 16px; border:2px solid #E5E7EB;
            border-radius:12px; font-size:.95rem; font-family:'Noto Sans KR',sans-serif;
            color:#111827; background:white; transition:all .3s; cursor:pointer;
        }
        .date-input:focus { outline:none; border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,58,237,.12); }

        .status-msg { margin-top:12px; padding:12px 16px; border-radius:12px; font-size:.85rem; font-weight:700; text-align:center; }
        .status-msg.ok { background:#ECFDF5; color:#059669; }
        .status-msg.ng { background:#FFF1F2; color:#E11D48; }

        /* 안내 섹션 */
        .info-section { border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(124,58,237,.08); margin-bottom:18px; }
        .info-bar { height:4px; background:linear-gradient(90deg,#7C3AED,#DB2777); }
        .info-body { background:#FAFAFA; padding:16px 18px; border:1px solid rgba(124,58,237,.07); border-top:none; border-radius:0 0 16px 16px; }
        .info-body h3 { font-size:.82rem; font-weight:800; color:#374151; margin-bottom:12px; }
        .info-list { list-style:none; }
        .info-list li { padding:8px 0; border-bottom:1px solid #F3F4F6; font-size:.82rem; color:#374151; display:flex; align-items:flex-start; gap:8px; }
        .info-list li:last-child { border-bottom:none; }
        .info-list li::before { content:'•'; color:var(--violet); font-weight:900; font-size:1rem; line-height:1.2; flex-shrink:0; }
        .info-list strong { color:var(--violet); font-weight:800; }

        /* 프로그램 */
        .prog-section-title { font-size:.75rem; font-weight:700; color:var(--gray); letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px; }
        .prog-card { border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(124,58,237,.09); margin-bottom:12px; transition:transform .2s, box-shadow .2s; cursor:pointer; }
        .prog-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(124,58,237,.16); }
        .prog-card-bar { height:5px; background:linear-gradient(90deg,#7C3AED,#DB2777); }
        .prog-card-body { background:#FAFAFA; padding:16px 18px; border:1px solid rgba(124,58,237,.07); border-top:none; border-radius:0 0 16px 16px; }
        .prog-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .prog-num { background:linear-gradient(135deg,#7C3AED,#DB2777); color:white; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:800; flex-shrink:0; }
        .prog-status-ok { background:#ECFDF5; color:#059669; font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:20px; }
        .prog-status-ng { background:#F3F4F6; color:#9CA3AF; font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:20px; }
        .prog-name { font-size:.95rem; font-weight:800; color:#111827; margin-bottom:6px; }
        .prog-chips { display:flex; flex-wrap:wrap; gap:6px; }
        .chip { background:#F5F3FF; border:1px solid #DDD6FE; color:#5B21B6; font-size:.72rem; font-weight:600; padding:3px 10px; border-radius:20px; }

        /* 모달 */
        .modal { position:fixed; inset:0; background:rgba(30,27,46,.55); display:flex; align-items:flex-end; justify-content:center; z-index:1000; padding:0 0 0; backdrop-filter:blur(4px); }
        .modal.hidden { display:none; }
        .modal-sheet { background:white; border-radius:24px 24px 0 0; padding:28px 24px 40px; width:100%; max-width:480px; max-height:85vh; overflow-y:auto; position:relative; box-shadow:0 -8px 40px rgba(30,27,46,.25); }
        .modal-handle { width:40px; height:4px; background:#E5E7EB; border-radius:2px; margin:0 auto 20px; }
        .close-btn { position:absolute; top:20px; right:20px; background:#F3F4F6; border:none; width:34px; height:34px; border-radius:50%; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#6B7280; }
        .close-btn:hover { background:#E5E7EB; }

        .detail-num { background:linear-gradient(135deg,#7C3AED,#DB2777); color:white; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.9rem; font-weight:800; margin-bottom:12px; }
        .detail-title { font-size:1.15rem; font-weight:900; color:#111827; margin-bottom:6px; line-height:1.3; }
        .detail-desc { font-size:.82rem; color:var(--gray); margin-bottom:18px; line-height:1.6; }
        .detail-info-grid { display:grid; gap:8px; margin-bottom:18px; }
        .detail-row { background:linear-gradient(135deg,#F5F3FF,#FCE7F3); padding:12px 14px; border-radius:12px; }
        .detail-row-label { font-size:.72rem; color:var(--gray); margin-bottom:3px; font-weight:600; }
        .detail-row-val { font-size:.88rem; font-weight:700; color:#111827; }
        .detail-row-val.accent { color:var(--violet); }

        .freepass-box { background:linear-gradient(135deg,#4C1D95,#7C3AED,#DB2777); border-radius:14px; padding:16px; text-align:center; margin-bottom:16px; }
        .freepass-label { font-size:.78rem; color:rgba(255,255,255,.8); margin-bottom:4px; }
        .freepass-val { font-size:1.1rem; font-weight:800; color:white; }
        .apply-btn { display:block; width:100%; padding:14px; background:linear-gradient(135deg,#7C3AED 0%,#DB2777 100%); color:white; text-align:center; text-decoration:none; border-radius:14px; font-weight:800; font-size:.92rem; font-family:'Noto Sans KR',sans-serif; transition:all .3s; box-shadow:0 4px 14px rgba(124,58,237,.25); }
        .apply-btn:hover { box-shadow:0 8px 24px rgba(124,58,237,.4); transform:translateY(-1px); }
        .notice-box { background:#FFF1F2; color:#E11D48; padding:14px; border-radius:12px; font-size:.85rem; text-align:center; font-weight:700; }

        .hidden { display:none; }
        footer { padding:16px 20px 22px; text-align:center; background:white; }
        footer p { font-size:.73rem; color:#9CA3AF; }
    </style>
</head>
<body>
<div class="container">
    <header class="main-header">
        <div class="header-inner">
            <a href="index.html" class="back-link">← 기관 선택으로</a>
            <img src="logo.png" alt="부천여성청소년재단" class="logo-img-header">
            <div class="inst-badge">🧘 일쉼지원센터</div>
            <h1>맘편한 임산부<br>우선이용</h1>
            <p class="header-sub">증진강좌 프리패스 신청</p>
        </div>
    </header>

    <main>
        <!-- STEP 1 -->
        <div class="step-card">
            <div class="step-card-top">
                <div class="step-card-top-row">
                    <span class="step-pill">STEP 1</span>
                    <span class="step-title">출산일을 입력해주세요</span>
                </div>
                <div class="step-desc">산후 100일~1년 이내 감정노동자 대상</div>
            </div>
            <div class="step-card-body">
                <label class="date-label">출산일</label>
                <input type="date" id="birthDate" class="date-input">
                <div id="calculated-info" class="hidden">
                    <div class="status-msg" id="statusMessage"></div>
                </div>
            </div>
        </div>

        <!-- 프로그램 목록 -->
        <div id="program-buttons" class="hidden">
            <p class="prog-section-title">참여 가능한 프로그램</p>
            <div id="buttonsContainer"></div>
        </div>

        <!-- 안내 -->
        <div class="info-section">
            <div class="info-bar"></div>
            <div class="info-body">
                <h3>📋 프리패스 안내</h3>
                <ul class="info-list">
                    <li>정원의 <strong>10%(2명)</strong>를 임산부 프리패스로 배정</li>
                    <li><strong>선착순</strong>으로 접수됩니다</li>
                    <li>감정노동자 여부는 신청 시 확인될 수 있습니다</li>
                </ul>
            </div>
        </div>
    </main>

    <footer><p>© 일쉼지원센터 | 부천여성청소년재단</p></footer>
</div>

<!-- 모달 -->
<div id="detail-modal" class="modal hidden">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <button class="close-btn" onclick="closeModal()">✕</button>
        <div id="modal-body"></div>
    </div>
</div>

<script src="ilshim-data.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const dateInput = document.getElementById('birthDate');
        if (dateInput) {
            dateInput.addEventListener('change', calculateAndShowPrograms);
            dateInput.setAttribute('max', new Date().toISOString().split('T')[0]);
        }
        const modal = document.getElementById('detail-modal');
        if (modal) modal.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
    });

    function calculateAndShowPrograms() {
        const birthDateInput = document.getElementById('birthDate');
        const birthDate = new Date(birthDateInput.value);
        const today = new Date();
        if (!birthDateInput.value) return;
        const diffDays = Math.ceil(Math.abs(today - birthDate) / 86400000);

        const statusDiv = document.getElementById('calculated-info');
        const statusMessage = document.getElementById('statusMessage');
        const buttonsDiv = document.getElementById('program-buttons');
        const buttonsContainer = document.getElementById('buttonsContainer');

        statusDiv.classList.remove('hidden');

        let isEligible = false;
        if (diffDays < 100) {
            const remaining = 100 - diffDays;
            statusMessage.textContent = `⚠️ ${remaining}일 후 신청 가능 (산후 100일부터)`;
            statusMessage.className = 'status-msg ng';
        } else if (diffDays > 365) {
            statusMessage.textContent = `⚠️ 신청 기간이 지났습니다 (산후 1년 이내)`;
            statusMessage.className = 'status-msg ng';
        } else {
            statusMessage.textContent = `✓ 참여 가능합니다`;
            statusMessage.className = 'status-msg ok';
            isEligible = true;
        }

        buttonsDiv.classList.remove('hidden');
        buttonsContainer.innerHTML = '';

        programs.forEach((program, index) => {
            const canApply = isEligible && diffDays >= program.minDays && diffDays <= program.maxDays;
            const btn = createProgramButton(program, index + 1, canApply, diffDays);
            buttonsContainer.appendChild(btn);
        });

        window.userStatus = { birthDate: birthDateInput.value, elapsedDays: diffDays, isEligible };
    }

    function createProgramButton(program, number, canApply, userDays) {
        const card = document.createElement('div');
        card.className = 'prog-card';
        card.onclick = () => showDetail(program, number, canApply, userDays);
        card.innerHTML = `
            <div class="prog-card-bar"></div>
            <div class="prog-card-body">
                <div class="prog-card-header">
                    <span class="prog-num">${number}</span>
                    <span class="${canApply ? 'prog-status-ok' : 'prog-status-ng'}">${canApply ? '신청 가능' : '조건 미충족'}</span>
                </div>
                <div class="prog-name">${program.name}${program.part ? ' ' + program.part : ''}</div>
                <div class="prog-chips">
                    <span class="chip">📅 ${program.schedule.days}</span>
                    <span class="chip">⏰ ${program.schedule.time}</span>
                </div>
            </div>
        `;
        if (!canApply) card.style.opacity = '0.6';
        return card;
    }

    function showDetail(program, number, canApply, userDays) {
        const modal = document.getElementById('detail-modal');
        const modalBody = document.getElementById('modal-body');
        const timeDisplay = program.schedule.time !== '시간 미정' ? program.schedule.time : '시간 추후공지';

        let actionSection;
        if (canApply) {
            actionSection = `
                <div class="freepass-box">
                    <div class="freepass-label">임산부 프리패스 정원</div>
                    <div class="freepass-val">정원의 ${program.freePass.ratio} (${program.freePass.count}명)</div>
                </div>
                <a href="${program.link}" target="_blank" class="apply-btn">프리패스 신청하러 가기 →</a>
            `;
        } else {
            let noticeText = userDays < program.minDays
                ? `신청 가능까지 ${program.minDays - userDays}일 남았습니다`
                : `신청 가능 기간이 지났습니다`;
            actionSection = `<div class="notice-box">${noticeText}</div>`;
        }

        modalBody.innerHTML = `
            <div class="detail-num">${number}</div>
            <div class="detail-title">${program.name}${program.part ? ' ' + program.part : ''}</div>
            <div class="detail-desc">${program.description}</div>
            <div class="detail-info-grid">
                <div class="detail-row"><div class="detail-row-label">📅 운영기간</div><div class="detail-row-val">${program.schedule.period}</div></div>
                <div class="detail-row"><div class="detail-row-label">⏰ 시간</div><div class="detail-row-val">${timeDisplay}</div></div>
                <div class="detail-row"><div class="detail-row-label">📍 요일</div><div class="detail-row-val">${program.schedule.days}</div></div>
                <div class="detail-row"><div class="detail-row-label">👤 대상</div><div class="detail-row-val accent">${program.target}</div></div>
                <div class="detail-row"><div class="detail-row-label">📝 신청방법</div><div class="detail-row-val">${program.application.method}</div></div>
            </div>
            ${actionSection}
        `;

        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('detail-modal').classList.add('hidden');
        document.body.style.overflow = 'auto';
    }
</script>
</body>
</html>
