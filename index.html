<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부천여성청소년재단 - 맘편한 임산부 프리패스</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 재단 헤더 -->
        <header class="foundation-header">
            <div class="foundation-logo-main">
                <img src="logo.png" alt="부천여성청소년재단" class="foundation-logo-img">
            </div>
            <h1 class="foundation-title">부천여성청소년재단</h1>
            <h2 class="foundation-subtitle">맘편한 임산부 프리패스</h2>
            <p class="foundation-desc">누구나 장벽 없이 배움을 누릴 수 있는 포용적인 사회를 지향합니다</p>
        </header>

        <!-- 기관 선택 -->
        <main>
            <div class="select-section">
                <h3 class="select-title">📍 기관을 선택해주세요</h3>
                <p class="select-desc">각 기관별 임산부 프리패스 프로그램을 확인하실 수 있습니다</p>

                <div class="institution-grid" id="institutionGrid">
                    <!-- JavaScript로 생성 -->
                </div>
            </div>

            <!-- 정책 안내 -->
            <div class="policy-box">
                <h4>📋 정책 안내</h4>
                <p>부천시 인구정책의 일환으로 임산부(임신 중~분만 후)에게 전 프로그램 <strong>최우선 등록</strong> 기회를 제공합니다</p>
                <ul class="policy-list">
                    <li>임신 중 ~ 분만 후 6개월 (기관별 상이)</li>
                    <li>일쉼지원센터: 산후 100일 ~ 1년 감정노동자</li>
                    <li>정원의 10%~20% 프리패스 배정</li>
                </ul>
            </div>
        </main>

        <footer>
            <p>© 부천여성청소년재단</p>
            <p class="contact">문의: 032-XXX-XXXX</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
