<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램 안내 - 부천여성청소년재단</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 기관 헤더 -->
        <header class="institution-header" id="instHeader">
            <button onclick="goHome()" class="home-btn">← 홈으로</button>
            <h1 id="instName">기관명</h1>
            <p id="instDesc">기관 설명</p>
        </header>

        <!-- 상태 입력 -->
        <main>
            <div class="input-card">
                <div class="card-header">
                    <span class="badge">STEP 1</span>
                    <h2>현재 상태를 입력해주세요</h2>
                </div>

                <div class="status-tabs">
                    <button class="tab-btn active" onclick="selectTab('pregnancy')" id="tab-pregnancy">임신 중</button>
                    <button class="tab-btn" onclick="selectTab('postpartum')" id="tab-postpartum">출산 후</button>
                </div>

                <!-- 임신 중 입력 -->
                <div id="pregnancy-input" class="tab-content">
                    <label>현재 임신 주수</label>
                    <div class="input-row">
                        <input type="number" id="weeks" min="1" max="42" placeholder="예: 20">
                        <span class="unit">주</span>
                    </div>
                </div>

                <!-- 출산 후 입력 -->
                <div id="postpartum-input" class="tab-content hidden">
                    <label>출산 후 경과 기간</label>
                    <div class="input-row">
                        <input type="number" id="months" min="0" max="24" placeholder="0">
                        <span class="unit">개월</span>
                        <input type="number" id="days" min="0" max="31" placeholder="0">
                        <span class="unit">일</span>
                    </div>
                    <p class="hint">예: 100일 → 3개월 10일</p>
                </div>

                <button onclick="checkPrograms()" class="btn-primary">
                    프로그램 확인하기
                </button>
            </div>

            <!-- 프로그램 결과 -->
            <div id="program-results" class="program-results hidden">
                <h3 class="section-title">📚 참여 가능한 프로그램</h3>
                <div class="programs-list" id="programsList">
                    <!-- JavaScript로 생성 -->
                </div>
            </div>
        </main>

        <footer>
            <p>© 부천여성청소년재단</p>
        </footer>
    </div>

    <!-- 상세 모달 -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        // 페이지 로드 시 기관 정보 표시
        document.addEventListener('DOMContentLoaded', loadInstitution);
    </script>
</body>
</html>
