<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맘편한 임산부 우선이용</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose:   #F43F5E;
            --violet: #8B5CF6;
            --plum:   #6D28D9;
            --ink:    #1E1B2E;
            --mist:   #F8F7FF;
            --white:  #FFFFFF;
            --gray:   #6B7280;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Noto Sans KR',sans-serif; background:var(--mist); color:var(--ink); min-height:100vh; }
        .container { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--white); overflow:hidden; }

        /* 헤더 */
        .main-header { position:relative; padding:28px 24px 38px; overflow:hidden; background:linear-gradient(135deg, #8B5CF6 0%, #A855F7 40%, #EC4899 100%); }
        .main-header::before {
            content:''; position:absolute; inset:0;
            background:
                radial-gradient(ellipse 80% 60% at 90% 10%, rgba(255,255,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 0% 100%, rgba(255,255,255,0.06) 0%, transparent 60%);
            opacity: 1;
        }
        .main-header::after {
            content:''; position:absolute; bottom:0; left:0; right:0;
            height:50%; background:linear-gradient(to bottom, transparent, rgba(255,255,255,0.7));
            pointer-events:none;
        }
        .header-inner { position:relative; z-index:2; }
        .back-link {
            display:inline-flex; align-items:center; gap:6px;
            background:rgba(255,255,255,0.18); color:rgba(255,255,255,0.92);
            text-decoration:none; padding:7px 14px; border-radius:20px;
            font-size:0.78rem; font-weight:700; margin-bottom:18px;
            transition:background .2s;
        }
        .back-link:hover { background:rgba(255,255,255,0.28); }
        .logo-img-header { height:40px; width:auto; filter:brightness(0) saturate(0%); margin-bottom:16px; opacity:0.7; }
        .inst-badge {
            display:inline-block; background:rgba(255,255,255,0.18);
            color:rgba(255,255,255,0.92); border-radius:20px;
            padding:4px 12px; font-size:0.74rem; font-weight:700;
            margin-bottom:8px; backdrop-filter:blur(4px);
        }
        .main-header h1 { font-size:1.7rem; font-weight:600; color:#3B0764; line-height:1.3; letter-spacing:-.02em; margin-bottom:6px; }
        .header-sub { font-size:0.78rem; color:rgba(76,29,149,0.55); }

        /* 메인 */
        main { flex:1; padding:22px 20px; background:white; }

        /* STEP 카드 */
        .step-card {
            border-radius:18px; overflow:hidden;
            box-shadow:0 2px 16px rgba(124,58,237,.1); margin-bottom:18px;
        }
        .step-card-top {
            background:linear-gradient(135deg, #8B5CF6 0%, #A855F7 40%, #EC4899 100%);
            padding:14px 20px 12px;
            display:flex; align-items:center; gap:10px;
        }
        .step-pill {
            background:rgba(255,255,255,.22); color:white;
            font-size:.68rem; font-weight:800; padding:3px 10px;
            border-radius:20px; letter-spacing:.06em; flex-shrink:0;
        }
        .step-title { font-size:.95rem; font-weight:800; color:white; }
        .step-desc { font-size:.75rem; color:rgba(255,255,255,.75); margin-top:1px; }

        .step-card-body { background:#FAFAFA; padding:18px 20px; border:1px solid rgba(124,58,237,.08); border-top:none; border-radius:0 0 18px 18px; }

        /* Yes/No 버튼 */
        .yn-group { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
        .yn-btn {
            padding:14px 10px; border-radius:14px; border:2px solid #E5E7EB;
            background:white; font-size:.88rem; font-weight:700;
            font-family:'Noto Sans KR',sans-serif; cursor:pointer;
            transition:all .2s; color:#374151;
        }
        .yn-btn:hover { border-color:#A78BFA; background:#F5F3FF; color:var(--violet); }
        .yn-btn.selected { background:linear-gradient(135deg, #8B5CF6, #F472B6); color:white; border-color:transparent; box-shadow:0 4px 14px rgba(124,58,237,.3); }

        /* 날짜 입력 */
        .date-label { display:block; font-weight:700; margin-bottom:8px; color:#374151; font-size:.85rem; }
        .date-input {
            width:100%; padding:14px 16px; border:2px solid #E5E7EB;
            border-radius:12px; font-size:.95rem; font-family:'Noto Sans KR',sans-serif;
            color:#111827; background:white; transition:all .3s; cursor:pointer;
        }
        .date-input:focus { outline:none; border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,58,237,.12); }

        /* 상태 메시지 */
        .status-msg {
            margin-top:12px; padding:12px 16px; border-radius:12px;
            font-size:.85rem; font-weight:700; text-align:center;
        }
        .status-msg.ok  { background:#ECFDF5; color:#059669; }
        .status-msg.ng  { background:#FFF1F2; color:#E11D48; }
        .status-msg.preg-ok {
            background:linear-gradient(135deg,#ECFDF5,#D1FAE5);
            color:#065F46; border-radius:12px; padding:14px; text-align:center;
            font-size:.85rem; font-weight:700;
        }

        /* 프로그램 카드 */
        .prog-section-title { font-size:.75rem; font-weight:700; color:var(--gray); letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px; }

        .prog-card {
            border-radius:16px; overflow:hidden;
            box-shadow:0 2px 12px rgba(124,58,237,.09);
            margin-bottom:12px;
            transition:transform .2s, box-shadow .2s;
        }
        .prog-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(124,58,237,.16); }

        .prog-card-bar {
            height:5px;
            background:linear-gradient(90deg, #A78BFA, #F472B6);
        }
        .prog-card-body { background:#FAFAFA; padding:16px 18px; border:1px solid rgba(124,58,237,.07); border-top:none; border-radius:0 0 16px 16px; }

        .prog-name { font-size:.97rem; font-weight:800; color:#111827; margin-bottom:5px; }
        .prog-desc { font-size:.8rem; color:var(--gray); line-height:1.6; margin-bottom:12px; }

        .prog-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
        .chip {
            background:#F5F3FF; border:1px solid #DDD6FE;
            color:#5B21B6; font-size:.72rem; font-weight:600;
            padding:3px 10px; border-radius:20px;
        }

        .prog-divider { border:none; border-top:1px dashed #DDD6FE; margin-bottom:12px; }

        .freepass-row {
            background:linear-gradient(135deg, #7C3AED, #A855F7, #EC4899);
            border-radius:10px; padding:10px 14px;
            font-size:.78rem; font-weight:700; color:white;
            text-align:center; margin-bottom:10px;
        }
        .apply-meta { font-size:.76rem; color:var(--gray); margin-bottom:10px; }

        .apply-btn {
            display:block; width:100%; padding:13px;
            background:linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
            color:white; text-align:center; text-decoration:none;
            border-radius:12px; font-weight:800; font-size:.9rem;
            font-family:'Noto Sans KR',sans-serif;
            transition:all .3s; box-shadow:0 4px 14px rgba(124,58,237,.25);
        }
        .apply-btn:hover { box-shadow:0 8px 24px rgba(124,58,237,.4); transform:translateY(-1px); }

        /* 미해당 */
        .not-eligible-box {
            background:#FFF1F2; border-radius:16px; padding:22px;
            text-align:center; margin-bottom:18px; border:1px solid #FECDD3;
        }
        .not-eligible-box p { color:#E11D48; font-weight:700; margin-bottom:14px; font-size:.88rem; }
        .homepage-btn {
            display:inline-block; padding:11px 22px; background:white;
            color:var(--violet); border-radius:12px; font-weight:700;
            font-size:.85rem; text-decoration:none; border:2px solid #DDD6FE;
            transition:all .2s;
        }
        .homepage-btn:hover { background:#F5F3FF; }

        /* 기관 정보 */
        .inst-info {
            border-radius:16px; overflow:hidden;
            box-shadow:0 2px 12px rgba(124,58,237,.08); margin-bottom:18px;
        }
        .inst-info-bar { height:4px; background:linear-gradient(90deg, #A78BFA, #F472B6); }
        .inst-info-body { background:#FAFAFA; padding:16px 18px; border:1px solid rgba(124,58,237,.07); border-top:none; border-radius:0 0 16px 16px; }
        .inst-info-title { font-size:.82rem; font-weight:800; color:#374151; margin-bottom:12px; }
        .info-row { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid #F3F4F6; font-size:.8rem; }
        .info-row:last-child { border-bottom:none; }
        .ikey { color:var(--gray); min-width:56px; font-weight:600; }
        .ival { color:#111827; font-weight:600; }
        .ival a { color:var(--violet); text-decoration:none; }

        .hidden { display:none; }
        footer { padding:16px 20px 22px; text-align:center; background:white; }
        footer p { font-size:.73rem; color:#9CA3AF; }
    </style>
</head>

        <!-- 기관 정보 -->
        <div class="inst-info" id="instInfoCard">
            <div class="inst-info-bar"></div>
            <div class="inst-info-body" id="instInfoBody"></div>
        </div>
    </main>

    <footer><p id="footerText">© 부천여성청소년재단</p></footer>
</div>

<script src="inst-data.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const instKey = params.get('inst');
    const inst = institutionsData[instKey];
    if (!inst) { window.location.href = 'index.html'; }

    document.getElementById('instBadge').textContent = inst.name;
    document.title = inst.name + ' - 맘편한 임산부 우선이용';
    document.getElementById('footerText').textContent = '© ' + inst.fullName + ' | 부천여성청소년재단';
    document.getElementById('homepageLink').href = inst.website;

    document.getElementById('instInfoBody').innerHTML = `
        <p class="inst-info-title">📞 기관 정보</p>
        <div class="info-row"><span class="ikey">기관명</span><span class="ival">${inst.fullName}</span></div>
        <div class="info-row"><span class="ikey">전화</span><span class="ival">${inst.phone}</span></div>
        <div class="info-row"><span class="ikey">주소</span><span class="ival">${inst.address}</span></div>
        <div class="info-row"><span class="ikey">홈페이지</span><span class="ival"><a href="${inst.website}" target="_blank">바로가기 →</a></span></div>
        <div class="info-row"><span class="ikey">신청</span><span class="ival">${inst.applicationNote}</span></div>
    `;

    function selectStatus(status) {
        document.getElementById('btnPregnant').classList.toggle('selected', status === 'pregnant');
        document.getElementById('btnPostpartum').classList.toggle('selected', status === 'postpartum');
        document.getElementById('pregnantSection').classList.toggle('hidden', status !== 'pregnant');
        document.getElementById('postpartumSection').classList.toggle('hidden', status !== 'postpartum');
        document.getElementById('programSection').classList.add('hidden');
        document.getElementById('notEligibleSection').classList.add('hidden');
        if (status === 'pregnant') showPrograms();
        else document.getElementById('postpartumStatus').classList.add('hidden');
    }

    function checkPostpartum() {
        const val = document.getElementById('birthDate').value;
        if (!val) return;
        const diffDays = Math.ceil(Math.abs(new Date() - new Date(val)) / 86400000);
        const maxDays = inst.maxPostpartumDays;
        const statusDiv = document.getElementById('postpartumStatus');
        const msgEl = document.getElementById('statusMessage');
        statusDiv.classList.remove('hidden');
        if (diffDays <= maxDays) {
            msgEl.textContent = `✓ 출산 후 ${diffDays}일 — 참여 가능합니다 (${maxDays - diffDays}일 남음)`;
            msgEl.className = 'status-msg ok';
            showPrograms();
        } else {
            msgEl.textContent = `⚠️ 출산 후 ${diffDays}일이 지났습니다 (6개월 초과)`;
            msgEl.className = 'status-msg ng';
            document.getElementById('programSection').classList.add('hidden');
            document.getElementById('notEligibleSection').classList.remove('hidden');
            document.getElementById('notEligibleMsg').textContent = '⚠️ 출산 후 6개월이 지나 프리패스 대상이 아닙니다. 일반 강좌를 이용해 주세요.';
        }
    }

    function showPrograms() {
        const section = document.getElementById('programSection');
        const list = document.getElementById('programList');
        document.getElementById('notEligibleSection').classList.add('hidden');
        section.classList.remove('hidden');
        list.innerHTML = '';
        inst.programs.forEach(prog => {
            const card = document.createElement('div');
            card.className = 'prog-card';
            card.innerHTML = `
                <div class="prog-card-bar"></div>
                <div class="prog-card-body">
                    <div class="prog-name">${prog.name}</div>
                    <div class="prog-desc">${prog.description}</div>
                    <div class="prog-chips">
                        <span class="chip">📅 ${prog.schedule.days}</span>
                        <span class="chip">⏰ ${prog.schedule.time}</span>
                        <span class="chip">🗓 ${prog.schedule.period}</span>
                    </div>
                    <hr class="prog-divider">
                    <div class="freepass-row">🎟 프리패스 배정 ${prog.freePass.count} / 전체 ${prog.freePass.totalCapacity} (${prog.freePass.ratio})</div>
                    <div class="apply-meta">📝 ${prog.application.method} &nbsp;|&nbsp; 신청기간: ${prog.application.period}</div>
                    <a href="${prog.link}" target="_blank" class="apply-btn">프리패스 신청하러 가기 →</a>
                </div>
            `;
            list.appendChild(card);
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        const di = document.getElementById('birthDate');
        if (di) di.setAttribute('max', new Date().toISOString().split('T')[0]);
    });
</script>
</body>
</html>
